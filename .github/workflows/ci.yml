name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build
      - run: npm pack --dry-run

  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform ios --output-dir /tmp/export-ios
      - run: npx expo export --platform web --output-dir /tmp/export-web

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install
        working-directory: example/ios
      - run: >-
          xcodebuild -workspace ios/DuoExample.xcworkspace -scheme DuoExample -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleDebug
        working-directory: example/android
